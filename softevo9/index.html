<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoftEvo</title>
<link rel="canonical" href="../">
<body style="background:#0b0f24;color:#f5f7ff;font-family:monospace;display:grid;place-items:center;min-height:100vh;margin:0">
<p><a href="../" style="color:#43e0a8">SoftEvo はこちらへ移動しました →</a></p>
<script>
  // SoftEvo はリポジトリ直下へ移動した。旧 softevo9/ の Service Worker を外してから移動する
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        for (const r of await navigator.serviceWorker.getRegistrations()) if (/\/softevo9\/$/.test(r.scope)) await r.unregister();
      }
    } catch (e) { /* ignore */ }
    location.replace('../');
  })();
</script>
</body>
</html>
