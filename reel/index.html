<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Softevo Reels</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../fonts/dotgothic16.css">
<style>
  :root { --ink: #05060e; --n1: #0b0f24; --n2: #131a3a; --n4: #304377; --n6: #8197cf; --white: #f5f7ff; --t3: #43e0a8; --g2: #ffd166; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--white); font-family: "DotGothic16", monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px; }
  #frame { height: min(84vh, calc((100vw - 20px) * 16 / 9)); aspect-ratio: 9 / 16; image-rendering: pixelated; background: var(--n1); outline: 2px solid var(--n4); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; width: min(100%, 720px); }
  .bar button, .bar select { font: inherit; color: var(--white); background: var(--n2); border: 2px solid var(--n4); padding: 4px 10px; cursor: pointer; }
  .bar button:hover { background: var(--n4); }
  .bar input[type=range] { flex: 1; min-width: 160px; accent-color: var(--t3); }
  .bar label { display: flex; gap: 4px; align-items: center; color: var(--n6); font-size: 14px; }
  #time { font-variant-numeric: tabular-nums; min-width: 110px; text-align: center; color: var(--g2); }
  #note { color: var(--n6); font-size: 13px; text-align: center; max-width: 720px; }
  /* SoftEvo の描画部品はここで描いてから、1枚の 1080×1920 に合成する (画面には出さない) */
  #work { position: fixed; left: -4000px; top: 0; }
</style>
</head>
<body>
<canvas id="frame" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="0" value="0">
  <span id="time">0.0 / 0.0 s</span>
  <label><input id="guides" type="checkbox"> IG safe zones</label>
  <button id="cover">Cover</button>
</div>
<div id="note">Softevo Reels · ?ep=episodes/ep001.json&amp;audio=../out/ep001/music.wav · 1080×1920 · 30 fps · 16 s loop · export with reel/capture.mjs</div>
<div id="work"><canvas id="w-world"></canvas><canvas id="w-brain"></canvas><canvas id="w-cover"></canvas></div>
<script type="module" src="reel.js"></script>
</body>
</html>
